<app-navbar [showNavbar]="showNavbar"></app-navbar>

<div class="container py-4">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm border-0 hover-card">
        <img 
          [src]="product.imageurl" 
          class="card-img-top" 
          [alt]="product.name"
          style="height: 200px; object-fit: cover; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem;"
        >
        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-primary">{{ product.name }}</h5>
          <p class="card-text text-muted fw-semibold mb-3">₹{{ product.price | number }}</p>
          <button 
            class="btn btn-outline-primary mt-auto" 
            (click)="addToCart(product.productId)"
          >
            <i class="bi bi-cart-plus me-1"></i> Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
